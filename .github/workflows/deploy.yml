name: Deploy to globbin.se

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./frontend/dist/*
          remote_path: ${{ secrets.FTP_FRONTEND_DIR }}

      - name: Deploy frontend assets
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./frontend/dist/assets/*
          remote_path: ${{ secrets.FTP_FRONTEND_DIR }}assets

      - name: Deploy .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./frontend/dist/.htaccess
          remote_path: ${{ secrets.FTP_FRONTEND_DIR }}

      # config.local.php is never committed; it is built here from repo secrets.
      # Host, database and user are not secret; the passwords are.
      - name: Build backend config from secrets
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for v in DB_PASS ADMIN_PASSWORD; do
            [ -n "${!v}" ] || { echo "Secret $v is missing"; exit 1; }
          done
          php -r '
            $c = [
              "DB_HOST" => "localhost",
              "DB_NAME" => "c2s4tpyp0_globbin_se",
              "DB_USER" => "c2s4tpyp0_globbin_se",
              "DB_PASS" => getenv("DB_PASS"),
              "DB_CHARSET" => "utf8mb4",
              "ADMIN_PASSWORD_HASH" => password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT),
            ];
            echo "<?php", PHP_EOL;
            foreach ($c as $k => $v) echo "define(", var_export($k, true), ", ", var_export($v, true), ");", PHP_EOL;
          ' > backend/api/config.local.php
          php -l backend/api/config.local.php

      - name: Deploy backend
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./backend/api/*
          remote_path: ${{ secrets.FTP_BACKEND_DIR }}
